<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fourier Atlas · 纯净绘图</title>
<meta name="description" content="从一个旋转圆开始，步长随圆数渐增，默认到 512 个圆，最高 1024 个圆。探索十国地图、人口前十省区和四神瓦当纹样，保留浅色历史轨迹。可交互的傅里叶本轮绘图实验。">
<meta name="theme-color" content="#101716"><meta property="og:title" content="傅里叶地图实验室"><meta property="og:description" content="一个圆，一个世界。从圆周运动到国家轮廓，亲眼看见傅里叶级数的渐进逼近。"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
<script src="countries.js" defer></script><script src="app.js" defer></script>
<link rel="canonical" href="https://xiaosang.cc/fourier-atlas/pure">
<script defer src="https://cloud.umami.is/script.js" data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"></script>
</head>
<body class="pure" data-default-shape="QINGLONG">
<main class="pure-main"><div class="canvas-wrap"><canvas id="drawing" role="img" aria-label="傅里叶轮廓绘图"></canvas></div></main>
<button class="pure-toggle" id="open-settings" type="button" aria-haspopup="dialog" aria-controls="parameter-panel">参数</button>
<dialog class="parameter-panel" id="parameter-panel" aria-labelledby="panel-title">
<div class="panel-header"><h1 id="panel-title">参数</h1><button type="button" id="close-settings">收起</button></div>
<h2 id="country-name" class="sr-only"></h2><div class="live-state sr-only"><span id="state-dot"></span><span id="state-text"></span></div>
<aside class="sidebar"><div class="map-groups" role="group" aria-label="地图分类"><button type="button" data-group="world" aria-pressed="true" aria-controls="countries">世界国家</button><button type="button" data-group="province" aria-pressed="false" aria-controls="provinces">中国省区</button><button type="button" data-group="complex" aria-pressed="false" aria-controls="complex-shapes">四神瓦当</button></div><div id="countries" class="country-grid" role="group" aria-label="选择国家"></div><div id="provinces" class="country-grid province-grid" role="group" aria-label="选择中国省级行政区" hidden></div><p id="group-note" class="group-note" hidden>2024 年末常住人口前 10 · 万人</p><div id="complex-shapes" class="country-grid complex-grid" role="group" aria-label="选择四神瓦当纹样" hidden></div><p id="country-note" class="sr-only"></p></aside><div class="playback"><button type="button" id="play" class="primary">暂停</button><button type="button" id="restart" class="secondary" aria-label="从一个旋转圆重新开始">重新开始</button><div class="lap-track" aria-hidden="true"><div id="lap-fill"></div></div><span class="lap-value" id="lap-value">0%</span><button type="button" class="secondary" id="next" aria-label="完成本圈并进入下一圈">下一圈 →</button></div>
<div class="settings"><label class="range-label"><span>圆数（每条轮廓） <output id="terms-output" for="terms">1</output></span><input id="terms" type="range" min="1" max="512" value="1"></label><label class="range-label speed-label"><span>每圈用时 <output id="speed-output" for="speed">2.5 秒</output></span><input id="speed" type="range" min="0.5" max="6" step="0.5" value="2.5"></label></div>
<div class="progression-settings"><label><input type="checkbox" id="auto" checked>自动递进</label><label>步长 <select id="step-mode" aria-label="步长模式"><option value="adaptive" selected>渐增</option><option value="fixed">固定</option></select></label><label>每圈增加 <input id="increment" type="number" min="1" max="1024" step="1" value="1" readonly aria-label="每圈增加的旋转圆数量"> 个圆</label><label>结束于 <input id="max-terms" type="number" min="1" max="1024" step="1" value="512" aria-label="最终旋转圆数量"> 个圆</label></div><div class="options"><label><input type="checkbox" id="show-circles" checked>旋转圆</label><label><input type="checkbox" id="emphasize-circles">突出圆圈</label><label><input type="checkbox" id="show-outline" checked>原始轮廓</label><label><input type="checkbox" id="show-history" checked>历史轨迹</label></div>
<p class="sr-only" id="status" aria-live="polite">正在用 1 个旋转圆描绘中国。</p><section class="evolution" aria-label="不同圆数量的轮廓对比"><h2 class="sr-only">不同圆数的轮廓对比</h2><div id="stages" class="stages"></div></section>
<div class="panel-footer"><a href="./" id="full-view">完整界面</a><a href="https://github.com/holynova/fourier-atlas" target="_blank" rel="noopener">GitHub</a><span>v1.0.2</span></div>
</dialog>
</body></html>
